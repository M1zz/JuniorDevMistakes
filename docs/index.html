<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100 Dev Mistakes</title>
  <link rel="canonical" href="https://m1zz.github.io/JuniorDevMistakes/en/">
  <meta http-equiv="refresh" content="1; url=en/">
  <script>
    // 소개 페이지는 언어 폴더에 있다. 브라우저 언어에 맞는 폴더로 보낸다 (없으면 영어).
    const have = ["ko","en","en-GB","zh-Hans","zh-Hant","ja","ru","es","de","fr","it","pt-BR","th","vi","cs","da","el","fi","id","nb","nl","pl","sv","tr"];
    const pick = l => have.find(h => h.toLowerCase() === l.toLowerCase())
      || (/^zh-(tw|hk|mo|hant)/i.test(l) && "zh-Hant") || (/^zh/i.test(l) && "zh-Hans")
      || (/^(no|nn)/i.test(l) && "nb") || (/^pt/i.test(l) && "pt-BR")
      || have.find(h => h.split("-")[0] === l.split("-")[0].toLowerCase());
    const code = (navigator.languages || [navigator.language]).map(pick).find(Boolean) || "en";
    location.replace(code + "/");
  </script>
</head>
<body><p><a href="en/">100 Dev Mistakes</a> · <a href="ko/">실수 100</a></p></body>
</html>
